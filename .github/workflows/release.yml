name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build release binaries
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: ./scripts/build.sh "$RUNNER_TEMP/rewind-release" "$RELEASE_VERSION"
      - name: Generate checksums
        working-directory: ${{ runner.temp }}/rewind-release
        run: sha256sum rewind-* > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" "$RUNNER_TEMP"/rewind-release/* --clobber
          else
            gh release create "$RELEASE_VERSION" "$RUNNER_TEMP"/rewind-release/* --verify-tag --generate-notes
          fi
